name: Build zhuxi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Android backup export bridge
        run: |
          mkdir -p android/app/src/main/java/com/tttosnown/zhuxi
          cat > android/app/src/main/java/com/tttosnown/zhuxi/MainActivity.java <<'EOF'
          package com.tttosnown.zhuxi;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
              private static final int CREATE_DOCUMENT = 9101;
              private byte[] pendingBytes;
              private String pendingName;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  installExportBridge();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  installExportBridge();
              }

              private void installExportBridge() {
                  try {
                      if (getBridge() != null) {
                          WebView webView = getBridge().getWebView();
                          if (webView != null) {
                              webView.getSettings().setDomStorageEnabled(true);
                              webView.addJavascriptInterface(new ExportBridge(), "ZhuxiAndroid");
                          }
                      }
                  } catch (Exception ignored) { }
              }

              private class ExportBridge {
                  @JavascriptInterface
                  public void saveJson(final String base64, final String filename) {
                      try {
                          pendingBytes = Base64.decode(base64, Base64.DEFAULT);
                          pendingName = (filename == null || filename.trim().isEmpty()) ? "筑习备份.json" : filename;
                          runOnUiThread(() -> {
                              Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("application/json");
                              intent.putExtra(Intent.EXTRA_TITLE, pendingName);
                              intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                              startActivityForResult(intent, CREATE_DOCUMENT);
                          });
                      } catch (Exception ignored) {
                          pendingBytes = null;
                          pendingName = null;
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == CREATE_DOCUMENT) {
                      if (resultCode == Activity.RESULT_OK && data != null && data.getData() != null && pendingBytes != null) {
                          Uri uri = data.getData();
                          try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                              if (out != null) {
                                  out.write(pendingBytes);
                                  out.flush();
                              }
                          } catch (Exception ignored) { }
                          pendingBytes = null;
                          pendingName = null;
                          return;
                      }
                      pendingBytes = null;
                      pendingName = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhuxi-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
